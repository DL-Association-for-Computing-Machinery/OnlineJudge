openapi: 3.1.0
info:
  title: OnlineJudge Subject-Pinned Private Draft Management
  version: 0.1.0
  description: >-
    独立可选管理能力；未启用返回404，客户端不得回退到旧路径。
    沿用普通HTTPS会话、固定Host、同源POST及无转义路径别名；仅列表允许单个规范cursor query。
    每次首次读取实际会话后，在权限、候选、容量、材料或回执访问前比较请求头。
    请求头仅是前置条件，绝不作为身份或权限来源；不匹配返回409 DRAFT_SUBJECT_CHANGED。
    基础设施故障及未知结果优先返回503。所有响应no-store/nosniff。
security:
  - ordinarySession: []
paths:
  /api/v1/problem-draft-management/drafts:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
      - name: cursor
        in: query
        required: false
        description: >-
          不透明的owner绑定seek边界，非访问授权。只允许单个规范cursor；拒绝空值、重复、未知字段、编码别名及裸问号。
          首次不带query，之后原样使用next_cursor，不经浏览器Date/Number重建。
        schema:
          type: string
          minLength: 1
          maxLength: 192
          pattern: '^[A-Za-z0-9_-]+$'
    get:
      operationId: listOwnPrivateDrafts
      description: >-
        当前真实会话先匹配预期主体，再在同一短PG事务中检查恢复/账号/作者权限并按owner查询。
        按created_at降序、id的C排序降序，每页至多20条；只读八字段摘要，不读题面/材料或现候选，不占材料槽。
        只提供每页当前已提交视图，跨页不持有快照；较早时间戳的在途导入可迟提交而被旧边界漏过，需重新查看第一页。
        空页或末页不证明没有在途导入，不自动确认/替换/清理本机pending。
      responses:
        '200':
          description: 本人已提交草稿；无他人计数或全局统计。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [drafts, next_cursor]
                properties:
                  drafts:
                    type: array
                    maxItems: 20
                    items:
                      $ref: './problem-draft-imports.openapi.yaml#/components/schemas/ImportReceipt'
                  next_cursor:
                    type: string
                    maxLength: 192
                    pattern: '^[A-Za-z0-9_-]*$'
                    description: 空字符串表示本次无下一页；非空时仅当前页20条且观察到额外一条，游标取第20条。
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/sources:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
    get:
      operationId: listManagedDraftSources
      description: >-
        返回与旧来源协议相同的候选摘要；首次主体比较后进行权限预检，
        返回前再次读取会话并在PG检查当前权限。
      responses:
        '200':
          description: 已配置的候选摘要。
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                additionalProperties: false
                properties:
                  sources:
                    type: array
                    minItems: 1
                    maxItems: 10
                    items:
                      $ref: './problem-draft-imports.openapi.yaml#/components/schemas/Source'
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/imports:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
    post:
      operationId: importManagedPinnedDraft
      description: >-
        沿用旧固定修订导入的严格三字段、材料持久化、最终会话和PG事务合同。
        不确定结果保留原subject、source、request_key和revision，通过本协议查询回执；不自动重试POST。
      requestBody:
        $ref: './problem-draft-imports.openapi.yaml#/paths/~1api~1v1~1problem-draft-imports/post/requestBody'
      responses:
        '200': { $ref: './problem-draft-imports.openapi.yaml#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/imports/{request_key}:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getManagedDraftImportReceipt
      description: >-
        查询本人已提交回执，PG在同一事务中检查当前权限和owner；404不证明没有在途POST。
      responses:
        '200': { $ref: './problem-draft-imports.openapi.yaml#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/review-submissions:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
    post:
      operationId: submitOwnDraftForReview
      description: >-
        须显式启用 review_intake。保存本人草稿的精确修订和本人已接纳的参考报告；不产生批准。
        最多 1024 字节 JSON，拒绝重复字段。相同主体、键和材料返回原回执。
        相同修订和证据已退回时，新键返回 409 REVIEW_MATERIALS_RETURNED；只换键不产生新送审。
        若结果未知，保留原参数并查回执，不自动重发。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewIntent' }
      responses:
        '200': { $ref: '#/components/responses/ReviewReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/review-submissions/{request_key}:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getOwnReviewSubmissionReceipt
      description: 查询本人已提交的回执，须仍有出题权限。404 不证明没有在途 POST。
      responses:
        '200': { $ref: '#/components/responses/ReviewReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-draft-management/review-submissions/{request_key}/return:
    parameters:
      - $ref: '#/components/parameters/ExpectedSubject'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getOwnReviewReturn
      description: >-
        以本人原送审键读取相同修订及证据的退回理由；同材料的旧重复项共享结果。
        须有当前出题权限，不提供审核人账号或退回请求键。404 表示本次未见退回。
      responses:
        '200':
          description: 已提交的退回及理由
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [review_id, import_revision, evidence_sha256, reason, returned_at]
                properties:
                  review_id: { $ref: '#/components/schemas/ReviewID' }
                  import_revision: { $ref: '#/components/schemas/ReviewRevision' }
                  evidence_sha256: { $ref: '#/components/schemas/ReviewRevision' }
                  reason: { $ref: './problem-review.openapi.yaml#/components/schemas/ReturnReason' }
                  returned_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    ordinarySession: { $ref: './session.openapi.yaml#/components/securitySchemes/ordinarySession' }
  parameters:
    ExpectedSubject:
      name: X-OJ-Expected-Subject
      in: header
      required: true
      description: 必须恰好一个值，32位小写十六进制；重复、逗号合并或无效值返回400。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  responses:
    Failure:
      $ref: './problem-draft-imports.openapi.yaml#/components/responses/Failure'
    ReviewReceipt:
      description: 已记录送审材料
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, request_key, draft_id, import_revision, reference_request_id, content_version, created_at]
            properties:
              id: { $ref: '#/components/schemas/ReviewID' }
              request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
              draft_id: { $ref: '#/components/schemas/ReviewID' }
              import_revision: { $ref: '#/components/schemas/ReviewRevision' }
              reference_request_id: { $ref: '#/components/schemas/ReviewID' }
              content_version: { $ref: '#/components/schemas/ReviewRevision' }
              created_at: { type: string, format: date-time }
  schemas:
    ReviewIntent:
      type: object
      additionalProperties: false
      required: [request_key, draft_id, import_revision, reference_request_id]
      properties:
        request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
        draft_id: { $ref: '#/components/schemas/ReviewID' }
        import_revision: { $ref: '#/components/schemas/ReviewRevision' }
        reference_request_id: { $ref: '#/components/schemas/ReviewID' }
    ReviewID: { type: string, pattern: '^[0-9a-f]{32}$' }
    ReviewRevision: { type: string, pattern: '^[0-9a-f]{64}$' }

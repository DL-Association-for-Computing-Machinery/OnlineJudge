openapi: 3.1.0
info:
  title: OnlineJudge Assigned Problem Review
  version: 0.1.0
  description: >-
    默认关闭的独立审核读取能力。使用普通 HTTPS 会话及当前审核资格；
    每次只按明确分配读取一项的固定验证结论、对拍详情、批准阻断或审核材料。退回另需显式开启；不提供批准或发布。
security:
  - ordinarySession: []
paths:
  /api/v1/problem-review/{review_id}/evidence:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - name: review_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      operationId: getAssignedReviewEvidence
      description: >-
        拒绝 query、请求体和转义路径别名。先读取实际会话并比较预期主体，再同事务检查
        当前账号、资格、非作者和最新分配。撤权后重授须显式重新分配。
        未知、未分配、已撤分配、资格修订失配及作者自审均返回相同 404。
        比较字段缺失表示没有记录，不代表通过。所有响应 no-store/nosniff。
      responses:
        '200':
          description: 本次分配的送审修订与固定参考证据摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEvidence' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/comparison:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    get:
      operationId: getAssignedReviewComparison
      description: >-
        沿用审核证据的普通会话、当前资格及分配检查。只按送审 ID 读取与完整导入修订、对拍计划及
        已接纳证据摘要绑定的结果。拒绝 query、请求体和转义路径别名。响应至多 4096 字节；
        对拍未记录为 null，通过时没有反例，差异时只返回首个生成输入及两份输出。响应 no-store/nosniff。
      responses:
        '200':
          description: 送审证据与固定的独立对拍结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evidence, comparison]
                properties:
                  evidence: { $ref: '#/components/schemas/ReviewEvidence' }
                  comparison: { $ref: './problem-reference-requests.openapi.yaml#/components/schemas/GeneratedComparison' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/eligibility:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    get:
      operationId: getAssignedReviewEligibility
      description: >-
        核对当前非作者分配、完整导入修订与已接纳报告，以现行策略返回阻止批准的原因。
        未接入的必需验证和人工确认保持阻断。此结果仅为本次读取的快照，不可用于授权写入。
        拒绝 query、请求体及转义路径别名，响应至多 4096 字节，no-store/nosniff。
      responses:
        '200':
          description: 固定证据摘要、准入规则版本和稳定的阻断码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEligibility' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/materials:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - name: review_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      operationId: getAssignedReviewMaterials
      description: >-
        仅接受送审 ID，不接受 query、请求体、对象哈希、文件路径或转义路径别名。
        校验固定导入修订、正式计划和报告后，在事务外读取允许的对象。全部读完后重查同一会话、
        审核资格、分配、证据及引用；任何异常均不返回部分材料。响应 no-store/nosniff。
      responses:
        '200':
          description: 该项证据摘要、原修订题面和正式计划绑定的标程文本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewMaterials' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/return:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    post:
      operationId: returnAssignedReview
      description: >-
        需要 review_returns 和当前非作者分配。新决定绑定证据响应中的 assignment_revision、
        import_revision 与 evidence_sha256；任一变化返回 409。相同材料最多退回一次，
        即使已有多个送审 ID。理由为首尾无空白的非空 UTF-8，最多 512 字节，无控制字符。
        请求最多 4096 字节；未知提交使用原请求键查询。所有响应 no-store/nosniff。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnIntent' }
      responses:
        '200': { $ref: '#/components/responses/ReturnReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/return/{request_key}:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getAssignedReviewReturnReceipt
      description: 仅查看当前仍有分配的审核人本人写入的原键回执。404 不证明没有在途写入。
      responses:
        '200': { $ref: '#/components/responses/ReturnReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    ordinarySession: { $ref: './session.openapi.yaml#/components/securitySchemes/ordinarySession' }
  parameters:
    ReviewID:
      name: review_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
  responses:
    Failure: { $ref: './problem-draft-imports.openapi.yaml#/components/responses/Failure' }
    ReturnReceipt:
      description: 已提交的退回回执
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [review_id, request_key, assignment_revision, import_revision, evidence_sha256, reason, returned_at]
            properties:
              review_id: { $ref: '#/components/schemas/ID' }
              request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
              assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
              import_revision: { $ref: '#/components/schemas/SHA256' }
              evidence_sha256: { $ref: '#/components/schemas/SHA256' }
              reason: { $ref: '#/components/schemas/ReturnReason' }
              returned_at: { type: string, format: date-time }
  schemas:
    ID: { type: string, pattern: '^[0-9a-f]{32}$' }
    SHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
    AssignmentRevision: { type: integer, format: int64, minimum: 1 }
    ReturnReason: { type: string, minLength: 1, maxLength: 512 }
    ReturnIntent:
      type: object
      additionalProperties: false
      required: [request_key, assignment_revision, import_revision, evidence_sha256, reason]
      properties:
        request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
        assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
        import_revision: { $ref: '#/components/schemas/SHA256' }
        evidence_sha256: { $ref: '#/components/schemas/SHA256' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
    ReviewEligibility:
      type: object
      additionalProperties: false
      required: [evidence, policy_version, eligible, blockers]
      properties:
        evidence: { $ref: '#/components/schemas/ReviewEvidence' }
        policy_version: { const: 'oj.review-approval.v4' }
        eligible: { const: false }
        input_validator_evidence:
          type: object
          additionalProperties: false
          description: 仅完整修订与正式计划精确匹配受信 v6 报告时返回；不是本站运行或生产准入结果。
          required: [report_sha256, inputs, controls]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }
            inputs: { type: integer, minimum: 1 }
            controls: { const: 4 }
        independent_correctness_evidence:
          type: object
          additionalProperties: false
          description: 仅精确匹配已审查 v6 绑定的非卷积题返回。记录固定小用例的独立结果，不替代卷积本站对拍。
          required: [report_sha256, suite, cases]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }
            suite: { const: 'lc-small-oracles.v1' }
            cases: { type: integer, minimum: 1 }
        blockers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [materials_returned, formal_failed, policy_unavailable, comparison_mismatch, comparison_missing,
              independent_correctness_missing, statement_quality_missing, test_coverage_missing, input_validator_missing,
              checker_admission_missing, target_runtime_missing, solution_confirmation_missing]
    ReviewMaterials:
      type: object
      additionalProperties: false
      required: [evidence, statement, standard_solution]
      properties:
        evidence: { $ref: '#/components/schemas/ReviewEvidence' }
        statement: { $ref: './problem-drafts.openapi.yaml#/components/schemas/Preview' }
        standard_solution: { $ref: '#/components/schemas/ReviewSolution' }
    ReviewSolution:
      type: object
      additionalProperties: false
      required: [source]
      description: 入口及固定依赖的 UTF-8 原文合计至多 64 KiB；没有依赖时省略字段。
      properties:
        source: { type: string, minLength: 1 }
        dependencies:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [name, source]
            properties:
              name: { type: string, enum: ['lib/prime.hpp', 'lib/montgomery.hpp', 'lib/util.hpp', 'common/random.h'] }
              source: { type: string, minLength: 1 }
    ReviewEvidence:
      type: object
      additionalProperties: false
      required: [review_id, assignment_revision, draft_id, source_id, content_version, import_revision, source_lock_sha256,
        reference_request_id, formal_plan_sha256, profile_sha256, evidence_sha256, formal_verdict]
      dependentRequired:
        comparison_outcome: [comparison_plan_sha256]
      properties:
        review_id: { $ref: '#/components/schemas/ID' }
        assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
        draft_id: { $ref: '#/components/schemas/ID' }
        source_id: { type: string, minLength: 1, maxLength: 128 }
        content_version: { $ref: '#/components/schemas/SHA256' }
        import_revision: { $ref: '#/components/schemas/SHA256' }
        source_lock_sha256: { $ref: '#/components/schemas/SHA256' }
        reference_request_id: { $ref: '#/components/schemas/ID' }
        formal_plan_sha256: { $ref: '#/components/schemas/SHA256' }
        profile_sha256: { $ref: '#/components/schemas/SHA256' }
        evidence_sha256: { $ref: '#/components/schemas/SHA256' }
        formal_verdict: { type: string, enum: [AC, WA, CE, RE, TLE, MLE, OLE] }
        comparison_plan_sha256: { $ref: '#/components/schemas/SHA256' }
        comparison_outcome: { type: string, enum: [passed, mismatch] }

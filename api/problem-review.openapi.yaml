openapi: 3.1.0
info:
  title: OnlineJudge Assigned Problem Review
  version: 0.2.0
  description: >-
    默认关闭的独立审核读取能力。使用普通 HTTPS 会话及当前审核资格；
    可查询自己的当前分配，或读取一项明确分配的材料与验证证据。退回另需显式开启；不提供批准或发布。
security:
  - ordinarySession: []
paths:
  /api/v1/problem-review/assignments:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - name: cursor
        in: query
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{91}$' }
    get:
      operationId: listAssignedProblemReviews
      description: >-
        仅当前分配，排除本人草稿；每次检查普通会话与当前审核资格。每批最多核对 20 个候选，
        有后续历史候选时可能返回空列表及游标。游标仅供当前会话继续读取，打开材料另行授权。
        拒绝其余 query、请求体和转义路径别名。响应 no-store/nosniff，至多 20480 字节。
      responses:
        '200':
          description: 当前审核人分配及不透明的下一页游标
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assignments, next_cursor]
                properties:
                  next_cursor: { type: string, pattern: '^([A-Za-z0-9_-]{91})?$' }
                  assignments:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required: [review_id, source_id, import_revision, assignment_revision]
                      properties:
                        review_id: { $ref: '#/components/schemas/ID' }
                        source_id: { type: string, minLength: 1, maxLength: 128 }
                        import_revision: { $ref: '#/components/schemas/SHA256' }
                        assignment_revision: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/evidence:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - name: review_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      operationId: getAssignedReviewEvidence
      description: >-
        拒绝 query、请求体和转义路径别名。先读取实际会话并比较预期主体，再同事务检查
        当前账号、资格、非作者和最新分配。撤权后重授须显式重新分配。
        未知、未分配、已撤分配、资格修订失配及作者自审均返回相同 404。
        比较字段缺失表示没有记录，不代表通过。所有响应 no-store/nosniff。
      responses:
        '200':
          description: 本次分配的送审修订与固定参考证据摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEvidence' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/comparison:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    get:
      operationId: getAssignedReviewComparison
      description: >-
        沿用审核证据的普通会话、当前资格及分配检查。只按送审 ID 读取与完整导入修订、对拍计划及
        已接纳证据摘要绑定的结果。拒绝 query、请求体和转义路径别名。响应至多 4096 字节；
        对拍未记录为 null，通过时没有反例，差异时只返回首个生成输入及两份输出。响应 no-store/nosniff。
      responses:
        '200':
          description: 送审证据与固定的独立对拍结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evidence, comparison]
                properties:
                  evidence: { $ref: '#/components/schemas/ReviewEvidence' }
                  comparison: { $ref: './problem-reference-requests.openapi.yaml#/components/schemas/GeneratedComparison' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/eligibility:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    get:
      operationId: getAssignedReviewEligibility
      description: >-
        核对当前非作者分配、完整导入修订与已接纳报告，以现行策略返回阻止批准的原因。
        未接入的必需验证和人工确认保持阻断。此结果仅为本次读取的快照，不可用于授权写入。
        拒绝 query、请求体及转义路径别名，响应至多 4096 字节，no-store/nosniff。
      responses:
        '200':
          description: 固定证据摘要、准入快照摘要、准入规则版本和稳定的阻断码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEligibility' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/materials:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - name: review_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      operationId: getAssignedReviewMaterials
      description: >-
        仅接受送审 ID，不接受 query、请求体、对象哈希、文件路径或转义路径别名。
        校验固定导入修订、正式计划和报告后，在事务外读取允许的对象。全部读完后重查同一会话、
        审核资格、分配、证据及引用；任何异常均不返回部分材料。响应 no-store/nosniff。
      responses:
        '200':
          description: 该项证据摘要、原修订题面和正式计划绑定的标程文本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewMaterials' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/approve:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    post:
      operationId: approveAssignedReview
      description: 需要显式启用 review_approvals、同源请求及当前非作者分配。按服务端证据重算；阻断时不写入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key, assignment_revision, snapshot_sha256, reason]
              properties:
                request_key: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
                assignment_revision: { type: integer, minimum: 1 }
                snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                reason: { type: string, minLength: 1, maxLength: 512, description: 最多 512 个 UTF-8 字节，首尾无空白，无控制字符 }
      responses:
        '200': { $ref: '#/components/responses/ApprovalReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/approve/{request_key}:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
      - name: request_key
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    get:
      operationId: getAssignedReviewApprovalReceipt
      description: 仅当前原分配下的审核人按原键回读。404 不证明批准写入已回退。
      responses:
        '200': { $ref: '#/components/responses/ApprovalReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/return:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    post:
      operationId: returnAssignedReview
      description: >-
        需要 review_returns 和当前非作者分配。新决定绑定证据响应中的 assignment_revision、
        import_revision 与 evidence_sha256；任一变化返回 409。相同材料最多退回一次，
        即使已有多个送审 ID。理由为首尾无空白的非空 UTF-8，最多 512 字节，无控制字符。
        相同材料已有当前有效批准时返回 409 REVIEW_CHANGED。
        请求最多 4096 字节；未知提交使用原请求键查询。所有响应 no-store/nosniff。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnIntent' }
      responses:
        '200': { $ref: '#/components/responses/ReturnReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/return/{request_key}:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getAssignedReviewReturnReceipt
      description: 仅查看当前仍有分配的审核人本人写入的原键回执。404 不证明没有在途写入。
      responses:
        '200': { $ref: '#/components/responses/ReturnReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/statement-confirmation:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
    post:
      operationId: confirmAssignedStatementSemantics
      description: >-
        需要 statement_confirmations、当前非作者分配和同源 POST。明确声明已核对题意、约束、
        输入输出定义及样例解释。服务端校验冻结题面、样例及图片，在写事务内复核授权和证据。
        已退回或变更分配不能写入新确认。请求至多 4096 字节；提交未知时使用原键查询。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementConfirmationIntent' }
      responses:
        '200': { $ref: '#/components/responses/StatementConfirmationReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/problem-review/{review_id}/statement-confirmation/{request_key}:
    parameters:
      - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
      - $ref: '#/components/parameters/ReviewID'
      - name: request_key
        in: path
        required: true
        schema: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
    get:
      operationId: getAssignedStatementConfirmationReceipt
      description: 在原分配仍有效时只读查询本人原键回执。404 不证明没有在途写入。
      responses:
        '200': { $ref: '#/components/responses/StatementConfirmationReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    ordinarySession: { $ref: './session.openapi.yaml#/components/securitySchemes/ordinarySession' }
  parameters:
    ReviewID:
      name: review_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
  responses:
    ApprovalReceipt:
      description: 原批准的审计回执，不代表发布资格。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [review_id, request_key, assignment_revision, snapshot_sha256, approved_at]
            properties:
              review_id: { type: string, pattern: '^[a-f0-9]{32}$' }
              request_key: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
              assignment_revision: { type: integer, minimum: 1 }
              snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              approved_at: { type: string, format: date-time }
    Failure: { $ref: './problem-draft-imports.openapi.yaml#/components/responses/Failure' }
    StatementConfirmationReceipt:
      description: 已提交的原分配确认回执
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [review_id, request_key, assignment_revision, import_revision, evidence_sha256, checklist_version, confirmed_at]
            properties:
              review_id: { $ref: '#/components/schemas/ID' }
              request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
              assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
              import_revision: { $ref: '#/components/schemas/SHA256' }
              evidence_sha256: { $ref: '#/components/schemas/SHA256' }
              checklist_version: { const: 'oj.statement-semantics.v1' }
              confirmed_at: { type: string, format: date-time }
    ReturnReceipt:
      description: 已提交的退回回执
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [review_id, request_key, assignment_revision, import_revision, evidence_sha256, reason, returned_at]
            properties:
              review_id: { $ref: '#/components/schemas/ID' }
              request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
              assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
              import_revision: { $ref: '#/components/schemas/SHA256' }
              evidence_sha256: { $ref: '#/components/schemas/SHA256' }
              reason: { $ref: '#/components/schemas/ReturnReason' }
              returned_at: { type: string, format: date-time }
  schemas:
    ID: { type: string, pattern: '^[0-9a-f]{32}$' }
    SHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
    AssignmentRevision: { type: integer, format: int64, minimum: 1 }
    ReturnReason: { type: string, minLength: 1, maxLength: 512 }
    ReturnIntent:
      type: object
      additionalProperties: false
      required: [request_key, assignment_revision, import_revision, evidence_sha256, reason]
      properties:
        request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
        assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
        import_revision: { $ref: '#/components/schemas/SHA256' }
        evidence_sha256: { $ref: '#/components/schemas/SHA256' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
    StatementConfirmationIntent:
      type: object
      additionalProperties: false
      required: [request_key, assignment_revision, import_revision, evidence_sha256, checklist_version]
      properties:
        request_key: { $ref: './problem-draft-imports.openapi.yaml#/components/schemas/RequestKey' }
        assignment_revision: { $ref: '#/components/schemas/AssignmentRevision' }
        import_revision: { $ref: '#/components/schemas/SHA256' }
        evidence_sha256: { $ref: '#/components/schemas/SHA256' }
        checklist_version: { const: 'oj.statement-semantics.v1' }
    ReviewEligibility:
      type: object
      additionalProperties: false
      required: [evidence, policy_version, snapshot_sha256, eligible, blockers]
      properties:
        evidence: { $ref: '#/components/schemas/ReviewEvidence' }
        policy_version: { const: 'oj.review-approval.v14' }
        snapshot_sha256:
          $ref: '#/components/schemas/SHA256'
          description: 绑定当前账号代次、分配、固定证据及本次策略结果，用于比较状态；不授予批准或发布权限。
        eligible: { const: false }
        local_checker_evidence:
          type: object
          additionalProperties: false
          description: A+B 17 点精确绑定的本机隔离报告摘要，保留生产检查器及目标节点阻断。
          required: [scope, candidate_sha256, judge_manifest_sha256, runtime_profile_sha256, points, ac_report_sha256, wa_report_sha256, ole_report_sha256]
          properties:
            scope: { const: 'isolated-desktop' }
            candidate_sha256: { $ref: '#/components/schemas/SHA256' }
            judge_manifest_sha256: { $ref: '#/components/schemas/SHA256' }
            runtime_profile_sha256: { $ref: '#/components/schemas/SHA256' }
            points: { const: 17 }
            ac_report_sha256: { $ref: '#/components/schemas/SHA256' }
            wa_report_sha256: { $ref: '#/components/schemas/SHA256' }
            ole_report_sha256: { $ref: '#/components/schemas/SHA256' }
        statement_semantics_confirmed:
          const: true
          description: 仅当前分配有有效确认且材料未退回时返回。题面质量仍要求可信渲染证据。
        input_validator_evidence:
          type: object
          additionalProperties: false
          description: 仅现行档位和冻结绑定精确匹配受信 v6、A+B 17 点或并查集 20 点复验报告时返回；不替代正式运行或生产准入。
          required: [report_sha256, inputs, controls]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }
            inputs: { type: integer, minimum: 1 }
            controls: { const: 4 }
        independent_correctness_evidence:
          type: object
          additionalProperties: false
          description: 仅现行档位和冻结绑定精确匹配受信的非卷积 v6、A+B 17 点或并查集 20 点复验报告时返回。不替代正式运行或卷积本站对拍。
          required: [report_sha256, suite, cases]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }
            suite: { const: 'lc-small-oracles.v1' }
            cases: { type: integer, minimum: 1 }
        wrong_solution_evidence:
          type: object
          additionalProperties: false
          description: 仅精确匹配已审查 v6 绑定时返回。记录一个错误解的正式点对照，不能证明完整覆盖。
          required: [report_sha256, origin, candidate, rejected_case_position, accepted_case_positions]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }
            origin: { type: string, enum: [upstream, local] }
            candidate: { type: string, minLength: 1 }
            rejected_case_position: { type: integer, minimum: 1 }
            accepted_case_positions:
              type: array
              description: 拒绝前已记录为接受的点，按探测顺序排列。空数组表示报告没有此类记录。
              uniqueItems: true
              items: { type: integer, minimum: 1 }
        statement_rendering_evidence:
          type: object
          additionalProperties: false
          description: 仅精确命中已审查绑定时返回。包含原 v6 历史浏览器证据和已证明预览等价的 A+B、并查集、Z 算法修订；不是题意人工确认。
          required: [report_sha256, examples, formulas, format_blocks]
          properties:
            report_sha256: { $ref: '#/components/schemas/SHA256' }

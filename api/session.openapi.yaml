openapi: 3.1.0
info:
  title: OnlineJudge Session and Login
  version: 0.1.0
  description: >-
    描述显式会话 HTTPS 入口；默认 bootstrap/Compose 不启用会话。本人会话列表和撤销需配置 session_devices。
    Cookie 身份不授予邮箱所有权、训练、角色或管理权限。所有会话 Handler 响应均为
    Cache-Control=no-store、X-Content-Type-Options=nosniff，不开放跨源 CORS。
    请求必须实际使用 TLS 且 Host 精确匹配配置的公开 HTTPS Origin 的 authority。
    direct 模式忽略所有转发头；proxy 模式要求已验证且被 SHA-256 pin 的 mTLS 叶证书，
    由可信单跳代理删除并覆写转发头：单值 X-Forwarded-Host 匹配公开 Host、
    X-Forwarded-Proto=https、X-Forwarded-For 为单个有效 IP，不接受链、zone、未指定或组播地址，
    并拒绝 Forwarded/X-Real-IP。证书缺失或不可信可在握手失败而无 HTTP 响应。
    所有 POST 至少提供一个正向同源字段 Origin 或 Sec-Fetch-Site；出现的每个字段
    都须单值且正确，任一错误/重复字段不能由另一个正确字段抵消。GET 不要求这些同源字段。
    OPTIONS/HEAD 等不替代规定方法，不提供预检放行；精确路径之外不提供别名或重定向。
    普通会话与登录候选 Cookie 都是 Secure、HttpOnly、SameSite=Lax、Path=/、无 Domain 的 host-only Cookie，
    不接受请求体、查询参数或 Authorization 中的替代凭据；重复目标 Cookie 或坏 Cookie 语法拒绝。
    业务错误不设置或清除 Cookie。未知存储/恢复/取消/提交结果优先返回 503，即使同时包含拒绝原因，
    也不等于事务回滚或会话不存在。所有 POST 不自动重试；已有登录候选只显式确认或放弃原候选，
    不因超时/503 自动 begin 新尝试。确认结果不证明浏览器收到或保存了 Cookie；用后续只读会话查询核验。
security:
  - ordinarySession: []
paths:
  /api/v1/platform-admin/session/login:
    post:
      operationId: loginPlatformAdministrator
      security: []
      description: 仅在 management_sessions 启用时接受同源请求。使用共享登录限流和本人密码；要求当前启用的管理员角色及已验证邮箱。成功只发管理 Cookie；无保持登录或可恢复登录候选。已有有效管理会话时须先退出。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '204': {description: 已发放独立管理 Cookie，无响应体。}
        '400': {description: 请求格式无效。}
        '401': {description: 凭据或管理资格无效。}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/EntryNotEnabled'}
        '409': {description: 当前浏览器已持有有效管理会话。}
        '413': {description: 请求过大。}
        '415': {description: 需要 JSON 请求。}
        '429': {description: 共享登录限流已达上限。}
        '503': {description: 会话服务不可用或发放结果未知；不设置 Cookie，勿自动重试。}
  /api/v1/platform-admin/session:
    get:
      operationId: readManagementSession
      security: [{managementSession: []}]
      description: 读取当前管理主体及两项截止时间，不续期。普通 Cookie 无效。
      responses:
        '200': {$ref: '#/components/responses/ManagementSessionView'}
        '401': {description: 管理会话无效、过期或资格已撤销。}
        '404': {$ref: '#/components/responses/EntryNotEnabled'}
        '503': {$ref: '#/components/responses/SessionUnavailable'}
  /api/v1/platform-admin/session/activity:
    post:
      operationId: touchManagementSession
      security: [{managementSession: []}]
      description: 显式同源活动续期至多 30 分钟，不得突破原登录起 8 小时的截止时间。
      responses:
        '200': {$ref: '#/components/responses/ManagementSessionView'}
        '401': {description: 管理会话无效、过期或资格已撤销。}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/EntryNotEnabled'}
        '503': {$ref: '#/components/responses/SessionUnavailable'}
  /api/v1/platform-admin/session/logout:
    post:
      operationId: logoutManagementSession
      security: [{managementSession: []}]
      description: 同源退出，仅撤销当前管理会话。结果未知时使用只读查询核验。
      responses:
        '204': {description: 已确认退出并清除管理 Cookie。}
        '401': {description: 管理会话无效、过期或资格已撤销。}
        '403': {$ref: '#/components/responses/OriginRejected'}
        '404': {$ref: '#/components/responses/EntryNotEnabled'}
        '503': {$ref: '#/components/responses/SessionUnavailable'}
  /api/v1/session/rotate:
    post:
      operationId: rotateOrdinarySession
      description: >-
        仅在 session_rotation 启用时换发当前普通会话的凭据。
        原登录时间、空闲和绝对截止、名额及 Cookie 持久策略不变。
        使用共享登录恢复限流。成功后旧凭据立即失效。
        回执未知时先读取当前会话；若已失效则重新登录，勿自动重试轮换。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      responses:
        '204':
          description: 已确认换发；无响应体，仅设置新的普通会话 Cookie。
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '429': {description: 共享恢复限流已达上限。}
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/login/devices:
    post:
      operationId: listPendingLoginDevices
      security:
        - loginAttempt: []
      description: 配置 session_devices 后，在三个普通名额均有效时读取当前待确认登录的三个候选会话。使用原登录 Cookie、同源校验和恢复限流。返回 devices，current 均为 false；标识仅供本次待确认登录使用，无 Cookie 或业务权限。
      responses:
        '200': {description: 三条可替换会话的标识、当前标志和时间。}
        '400': {description: 登录尝试无效。}
        '401': {description: 登录尝试已失效。}
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409': {description: 名额或尝试已变化，或浏览器已有有效会话。}
        '429': {description: 恢复操作限流。}
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/login/replace-device:
    post:
      operationId: replacePendingLoginDevice
      security:
        - loginAttempt: []
      description: 显式确认替换一条旧会话，接纳原尝试。成功后发放原候选 Cookie 并清除待确认 Cookie。结果未知时只继续确认原尝试，勿重复替换。
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '204': {description: 原登录尝试已获准，无响应体。}
        '400': {description: 登录尝试或请求格式无效。}
        '401': {description: 登录尝试已失效。}
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409': {description: 标识或尝试已变化，或浏览器已有有效会话。}
        '429': {description: 恢复操作限流。}
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/devices/revoke:
    post:
      operationId: revokeOrdinarySessionDevice
      description: 撤销指定的本人其他会话。当前会话须走 logout；未知、过期、其他账号和当前会话的标识均返回 404。结果未知时先重新读取列表。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/DevicePrecondition'
      requestBody:
        required: true
        description: 请求体为设备列表返回的 64 字节小写十六进制标识，不带空白或引号。
        content:
          text/plain:
            schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '204': {description: 撤销已确认，无响应体或 Cookie 变更。}
        '400': {description: 请求体无法读取或超过 64 字节。}
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404': {description: 能力未启用或指定项不是本人其他有效会话。}
        '405':
          $ref: '#/components/responses/PostOnly'
        '409': {description: 当前会话与列表读取时不一致，或缺少会话标识前置条件。}
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/devices/revoke-others:
    post:
      operationId: revokeOtherOrdinarySessionDevices
      description: 撤销当次验证的全部本人其他有效会话。保留当前会话；没有其他有效会话时同样返回 204。结果未知时先重新读取列表。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/DevicePrecondition'
      responses:
        '204': {description: 撤销已确认或没有其他会话，无响应体或 Cookie 变更。}
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409': {description: 当前会话与列表读取时不一致，或缺少会话标识前置条件。}
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/devices:
    get:
      operationId: listOrdinarySessionDevices
      description: >-
        只读列出当前账号最多三个有效普通会话，并标记与 Cookie 匹配的一条。设备标识仅用于选择会话，
        不代表物理设备或登录凭据。读取不设置 Cookie、不续期、不修改 Redis。
      responses:
        '200':
          description: 本人有效会话。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subject_id, devices]
                properties:
                  subject_id: {type: string, pattern: '^[0-9a-f]{32}$'}
                  devices:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, current, created_at, idle_expires_at, absolute_deadline]
                      properties:
                        id: {type: string, pattern: '^[0-9a-f]{64}$'}
                        current: {type: boolean}
                        created_at: {type: string, format: date-time}
                        idle_expires_at: {type: string, format: date-time}
                        absolute_deadline: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/GetOnly'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session:
    get:
      operationId: readOrdinarySession
      description: >-
        用当前 Cookie 读取新鲜的完整会话及账号/恢复权威状态；只读，不续期、不设置 Cookie。
        返回恰好四个公开字段，不返回凭据、凭据版本或认证/恢复代次，也不是后续资源访问的可复用授权。
        默认策略为空闲两小时、最长十二小时；主动保持登录为空闲二十四小时、最长七天。
      responses:
        '200':
          $ref: '#/components/responses/SessionView'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/GetOnly'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/activity:
    post:
      operationId: renewOrdinarySessionActivity
      description: >-
        显式活动操作，只续期现有且有效的会话，不能创建、复活或更换会话，也不越过原 absolute deadline。
        请求体被忽略，无媒体类型要求；不重新发送 Cookie。轮询 GET 本身不能替代此操作。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      responses:
        '200':
          $ref: '#/components/responses/SessionView'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/logout:
    post:
      operationId: revokeOrdinarySession
      description: >-
        确认撤销当前 Cookie 对应的单个会话，随后只清除 __Host-oj_session，不清登录候选 Cookie，
        不代表退出所有设备。请求体被忽略，无媒体类型要求。缺失/过期记录的 401 不确认之前的撤销成功；
        503 也不能当作退出成功，不能先在客户端假定远端注销已完成。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      responses:
        '204':
          description: 已确认撤销；无响应体，只删除当前普通会话 Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /api/v1/session/login/begin:
    post:
      operationId: beginOrdinaryLogin
      security: []
      description: >-
        验证邮箱/当前密码并冻结加密候选；不写入活动会话、不占会话名额、不发普通会话 Cookie。
        已有任意登录候选 Cookie 时返回 LOGIN_PENDING，要求先确认或放弃。
        已有有效普通会话时返回 ALREADY_AUTHENTICATED，须先退出；无效格式的会话 Cookie 为 400，
        格式正确但已失效的会话 Cookie 不阻止新登录。密码按完整原始 UTF-8 字节验证，不 trim、归一化或截断；
        不将新密码最低长度规则应用于旧密码。可发生同密码 Legacy 参数升级，202 或后续错误都不能等同无数据库写入。
        已配置的限流在密码计算前原子扣取全局/来源/规范邮箱额度，凭据验证失败不退款；数值无公共默认值。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      requestBody:
        required: true
        description: >-
          最多 4096 个请求体字节，两个必需的非空字符串及可选布尔值 remember；拒绝未知、重复（包括转义别名）、null、
          非法 UTF-8/未配对 UTF-16 surrogate 及尾随数据。Content-Type 必须为 application/json，可带合法媒体参数。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 254
                  description: >-
                    仅 ASCII 裸地址、未加引号 local part 和 DNS 风格域标签；不接受空白、注释、地址字面量或国际化邮箱。
                    整个地址按不区分大小写匹配，保留点和 plus tag；不做 DNS 查询，不证明邮箱所有权。
                password:
                  type: string
                  format: password
                  minLength: 1
                  writeOnly: true
                  description: 完整字节长度还须满足该实例显式 KDF 输入上限；不回显或持久化在浏览器存储中。
                remember:
                  type: boolean
                  default: false
                  description: 主动选择才使用二十四小时空闲及七天绝对期限；选择随原候选冻结。
      responses:
        '202':
          description: 已准备候选；无响应体，恰好一个短期加密登录候选 Cookie，尚未登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Set-Cookie:
              $ref: '#/components/headers/PendingCookie'
        '400':
          $ref: '#/components/responses/LoginInvalid'
        '401':
          $ref: '#/components/responses/LoginRejected'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409':
          description: LOGIN_PENDING、ALREADY_AUTHENTICATED 或 LOGIN_ATTEMPT_CONFLICT；无 Cookie，不自动创建替代候选。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/LoginBodyTooLarge'
        '415':
          $ref: '#/components/responses/LoginMediaRequired'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '503':
          $ref: '#/components/responses/LoginUnavailable'
  /api/v1/session/login/complete:
    post:
      operationId: completeOrdinaryLogin
      security:
        - loginAttempt: []
      description: >-
        仅使用 __Host-oj_login 中原封冻结候选重放，并另行检查完整回执及当前权威；不重新接收邮箱或密码，
        不采用新代次替换旧候选。请求体被忽略，不读取/校验 JSON、媒体类型或 4096 字节请求体限制；客户端应发送空体。
        与 abandon 共享独立于 begin 的全局/来源恢复额度；不退款、不自动重试。
        已有有效普通会话返回 ALREADY_AUTHENTICATED；其 Cookie 格式错误为 400，已失效但格式正确可继续确认。
        确认始终受原登录窗口约束；首次写入还要求同 namespace/账号/认证及恢复代次的普通会话名额少于三个。
        窗口内、原回执未变化且没有有效普通会话阻挡时，同候选并发或显式重复确认可取得相同凭据及原截止时间。
        已活动续期后重放初始候选会冲突，不能回退 idle；不能保证 HTTP 恰好送达一次。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      responses:
        '204':
          description: >-
            已确认原候选；无响应体。两个独立 Set-Cookie：设置普通会话 Cookie 并删除登录候选 Cookie。
            必须分别处理，不能逗号合并；服务端确认不证明浏览器已经收到或接受 Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Set-Cookie:
              $ref: '#/components/headers/CompletedCookies'
        '400':
          $ref: '#/components/responses/LoginInvalid'
        '401':
          $ref: '#/components/responses/LoginRejected'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409':
          $ref: '#/components/responses/LoginConflict'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '503':
          $ref: '#/components/responses/LoginUnavailable'
  /api/v1/session/login/abandon:
    post:
      operationId: abandonOrdinaryLogin
      security:
        - loginAttempt: []
      description: >-
        只放弃并 tombstone 该加密候选，包括原登录窗口结束后的候选；原 absolute deadline 和两层权威检查仍适用。
        只清登录候选 Cookie，不清普通会话 Cookie，不撤销无关会话，也不证明之前的写入已回滚。
        如果该候选已经由并发或丢回执的 complete 发放，放弃可使其对应的普通会话失效；
        204 不等于确认当前普通会话退出或仍有效，客户端须另行只读检查。
        已在途的成功确认响应仍可能稍后到达，须只读核验。
        请求体被忽略，不读取/校验 JSON、媒体类型或 4096 字节请求体限制；客户端应发送空体。
        与 complete 共享全局/来源恢复额度。无需有效普通会话，且不校验其 Cookie 值的凭据格式，
        但整体 Cookie 语法错误或重复目标 Cookie 仍拒绝。缺失/无法接受的候选 Cookie 不以本地删除冒充已放弃。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/FetchSite'
      responses:
        '204':
          description: 已确认放弃；无响应体，只删除 __Host-oj_login，保留普通会话 Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Set-Cookie:
              $ref: '#/components/headers/ClearPendingCookie'
        '400':
          $ref: '#/components/responses/LoginInvalid'
        '401':
          $ref: '#/components/responses/LoginRejected'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '404':
          $ref: '#/components/responses/EntryNotEnabled'
        '405':
          $ref: '#/components/responses/PostOnly'
        '409':
          $ref: '#/components/responses/LoginConflict'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '503':
          $ref: '#/components/responses/LoginUnavailable'
components:
  securitySchemes:
    managementSession:
      type: apiKey
      in: cookie
      name: __Host-oj_management
      description: 独立不透明凭据，Secure、HttpOnly、SameSite=Strict、Path=/、无 Domain，成功登录无持久 Cookie 期限。
    ordinarySession:
      type: apiKey
      in: cookie
      name: __Host-oj_session
      description: 规范的 256-bit base64url 不透明凭据；须每次重新检查服务端会话与权威。
    loginAttempt:
      type: apiKey
      in: cookie
      name: __Host-oj_login
      description: 有界的加密冻结候选，不是已认证会话；仅用于登录确认、满额选择或放弃，不写入 URL、日志或 JS 存储。
  parameters:
    DevicePrecondition:
      name: X-OJ-Session-Device
      in: header
      required: true
      description: 本次列表中标记为当前会话的标识。Cookie 变化时拒绝撤销；该标识不授予权限。
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    Origin:
      name: Origin
      in: header
      required: false
      description: 与 Sec-Fetch-Site 至少有一个；出现时须单值且精确等于部署配置的公开 HTTPS Origin。
      schema: {type: string}
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: false
      description: 与 Origin 至少有一个；出现时须单值且只能为 same-origin。
      schema: {type: string, const: same-origin}
  headers:
    NoStore:
      schema: {const: no-store}
    NoSniff:
      schema: {const: nosniff}
    PendingCookie:
      description: >-
        单个 __Host-oj_login；Secure、HttpOnly、SameSite=Lax、Path=/、无 Domain。
        Expires 为候选原截止时间，Max-Age 为剩余窗口向上取整的秒数；不重新给完整窗口，服务端原期限仍为准。
      schema: {type: string}
    CompletedCookies:
      description: >-
        两个独立 Set-Cookie，不得逗号合并。__Host-oj_session 设置不透明凭据，Secure、HttpOnly、
        SameSite=Lax、Path=/、无 Domain；默认无 Expires/Max-Age，保持登录仅设置原绝对截止的 Expires。__Host-oj_login 以同一属性和
        Max-Age=0、过去的 Expires 删除。普通 Cookie 非持久配置不保证浏览器关闭立即撤销服务端会话。
      schema:
        type: array
        minItems: 2
        maxItems: 2
        items: {type: string}
    ClearSessionCookie:
      description: 单个 __Host-oj_session 删除头，值为空；Secure、HttpOnly、SameSite=Lax、Path=/、无 Domain、Max-Age=0、过去的 Expires。
      schema: {type: string}
    ClearPendingCookie:
      description: 单个 __Host-oj_login 删除头，值为空；Secure、HttpOnly、SameSite=Lax、Path=/、无 Domain、Max-Age=0、过去的 Expires。
      schema: {type: string}
  schemas:
    OrdinarySession:
      type: object
      additionalProperties: false
      required: [subject_id, created_at, idle_expires_at, absolute_deadline]
      properties:
        subject_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: 不透明主体 ID，不是邮箱或权限声明。
        created_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        absolute_deadline: {type: string, format: date-time}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: {const: 'about:blank'}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
  responses:
    ManagementSessionView:
      description: 当前管理主体和有效期限，不返回角色修订、认证代次或令牌。
      content:
        application/json:
          schema:
            type: object
            required: [subject_id, idle_expires_at, absolute_deadline]
            additionalProperties: false
            properties:
              subject_id: {type: string, pattern: '^[0-9a-f]{32}$'}
              idle_expires_at: {type: string, format: date-time}
              absolute_deadline: {type: string, format: date-time}
    SessionView:
      description: 恰好四个公开会话字段；不设置 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OrdinarySession'}
    SessionRequired:
      description: SESSION_REQUIRED；Cookie 缺失/格式错误/重复或会话已过期、撤销、账号权威拒绝；无 Cookie，不确认 logout 已成功。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SessionUnavailable:
      description: SESSION_UNAVAILABLE；存储/恢复/未知结果/取消优先于拒绝分类；无 Cookie。可能已有副作用，不自动重试写请求。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    OriginRejected:
      description: ORIGIN_REJECTED；已到达 Handler 的 TLS、Host、代理身份/转发头或 POST 正向同源证据不满足；无 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    GetOnly:
      description: METHOD_NOT_ALLOWED；精确路径仅接受 GET，错误方法不执行存储调用。
      headers:
        Allow: {schema: {const: GET}}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PostOnly:
      description: METHOD_NOT_ALLOWED；精确路径仅接受 POST，错误方法不执行存储调用。
      headers:
        Allow: {schema: {const: POST}}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginInvalid:
      description: INVALID_LOGIN 或 LOGIN_ATTEMPT_INVALID；begin JSON/邮箱/密码字节长度错误，或 Cookie 语法/重复/缺失/候选格式及认证封套无效；无 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginRejected:
      description: LOGIN_REJECTED；账号/密码不接受、原候选已失效/撤销或原账号/恢复权威拒绝；无 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginConflict:
      description: SESSION_LIMIT（仅 complete）、ALREADY_AUTHENTICATED（仅 complete）或 LOGIN_ATTEMPT_CONFLICT；无 Cookie，不重新创建候选规避冲突。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginRateLimited:
      description: LOGIN_RATE_LIMITED；已配置的共享登录额度不足；无 Cookie，无 Retry-After/额度维度或余量。拒绝不写计数/TTL，不退款或重试未知扣额。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginUnavailable:
      description: LOGIN_UNAVAILABLE（外层失败关闭也可为 SESSION_UNAVAILABLE）；计算/存储/恢复不可用、取消或结果不确定优先于拒绝；无 Cookie，保留原候选，禁止自动 begin 新尝试。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    EntryNotEnabled:
      description: NOT_FOUND；默认 bootstrap 未启用会话路径，或会话 Handler 未配置该登录能力；不执行会话/登录操作。仅会话 Handler 的响应保证 nosniff。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginBodyTooLarge:
      description: BODY_TOO_LARGE；仅 begin 的请求体超过 4096 字节；无 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginMediaRequired:
      description: UNSUPPORTED_MEDIA_TYPE；仅 begin 要求 application/json（允许合法媒体参数）；无 Cookie。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

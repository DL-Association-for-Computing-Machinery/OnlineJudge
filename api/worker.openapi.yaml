openapi: 3.1.0
info:
  title: OnlineJudge Private Worker API
  version: 0.8.0
  description: >-
    独立 loopback HTTPS 控制端，TLS 1.3 双向认证。判题客户端证书唯一 URI SAN 为
    spiffe://onlinejudge/worker/{node_id}/{credential_version}，不接受请求自报身份。
    每次操作验证证书及数据库节点状态/凭据版本；租约令牌绑定节点、尝试与代次。
    全部响应 Cache-Control 为 no-store；参考报告请求体上限 24 KiB，其余请求体上限 1024 字节。
    无证书、错误 CA、错误用途或握手时过期的证书在 TLS 层失败，无 HTTP 响应。
    未知路径 404，不支持方法 405。材料接口仅在配置 OJ_MATERIAL_ROOT 后开启。
    参考领取仅在配置 OJ_WORKER_REFERENCE_NODE_ID 时开启，并使用独立的
    spiffe://onlinejudge/reference-worker/{node_id}/{credential_version} 身份。
    参考材料额外要求 OJ_WORKER_REFERENCE_MATERIAL_ROOT；所有读取重新验证原授权及有效预留。
    领取响应丢失可能已占用容量，不得假定未认领；续租失败必须停止执行；
    结果确认丢失可原租约原结果重报。
servers:
  - url: https://127.0.0.1:8443
security:
  - workerMTLS: []
paths:
  /api/v1/worker/reference/claim:
    post:
      operationId: claimReferenceReservation
      description: >-
        仅供显式配置的参考节点。按申请 ID 领取，事务内复核原授权、申请状态、
        来源配置和预期计划。单一 30 秒预留的材料读取须逐次重新授权；执行前须收到单独启用的续期确认。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, source_id, plan_sha256]
              properties:
                request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
                source_id: {type: string, minLength: 1, maxLength: 128}
                plan_sha256: {$ref: '#/components/schemas/Digest'}
      responses:
        '200':
          description: 已提交的参考预留；不含计划正文、材料、授权快照或判定
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, source_id, plan_sha256, lease_token, lease_until]
                properties:
                  request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
                  source_id: {type: string, minLength: 1, maxLength: 128}
                  plan_sha256: {$ref: '#/components/schemas/Digest'}
                  lease_token: {$ref: '#/components/schemas/Digest'}
                  lease_until: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: 请求缺失、未准备、取消、失权、计划不匹配或参考容量已占用
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/dispatch:
    post:
      operationId: dispatchPreparedReference
      description: >-
        另行显式启用的专用 mTLS 选择入口。客户端在同一宿主及固定槽锁内按固定来源发一次请求。
        至多检查八条，首领历史与预留同事务写入；已领取或历史不明的计划不会再次自动选择。
        无可领取时只回继续游标，不表示不存在在途申请；未知结果不自动重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id]
              properties:
                source_id: {type: string, minLength: 1, maxLength: 128}
                after: {type: string, pattern: '^(|[0-9a-f]{32})$'}
      responses:
        '200':
          description: 最多一个绑定预留；有预留时游标为空。
          content:
            application/json:
              schema:
                type: object
                required: [claim, next_after]
                additionalProperties: false
                properties:
                  claim:
                    type: [object, 'null']
                    required: [request_id, source_id, plan_sha256, lease_token, lease_until]
                    additionalProperties: false
                    properties:
                      request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
                      source_id: {type: string, minLength: 1, maxLength: 128}
                      plan_sha256: {$ref: '#/components/schemas/Digest'}
                      lease_token: {$ref: '#/components/schemas/Digest'}
                      lease_until: {type: string, format: date-time}
                  next_after: {type: string, pattern: '^(|[0-9a-f]{32})$'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 未启用参考选择}
        '409': {description: 预留已占用或来源不可用}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/renew:
    post:
      operationId: renewReferenceReservation
      description: >-
        仅同机专用参考节点且 OJ_WORKER_REFERENCE_EXECUTION=1。复核原授权及固定计划，
        只延长未过期的相同预留。回执未知或失败须停止；数据库过期不是沙箱停止证明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ReferenceMaterialInput'}
                - not: {required: [object]}
      responses:
        '200': {$ref: '#/paths/~1api~1v1~1worker~1reference~1claim/post/responses/200'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 参考执行未显式启用}
        '409': {description: 预留过期、绑定不符，或原申请及授权已失效}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/report:
    post:
      operationId: acceptReferenceWorkerEvidence
      description: >-
        仅显式启用执行的专用参考节点。首次接纳须匹配有效预留、原授权、草稿和控制端冻结计划；
        有已准备卷积对拍计划的正式 AC 首报还须提供可验证的对拍通过或首个合法差异。
        完全相同的历史重放仅确认既有结果，不改变任何预留或发布状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, source_id, plan_sha256, lease_token, evidence]
              properties:
                request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
                source_id: {type: string, minLength: 1, maxLength: 128}
                plan_sha256: {$ref: '#/components/schemas/Digest'}
                lease_token: {$ref: '#/components/schemas/Digest'}
                evidence: {type: string, contentEncoding: base64, maxLength: 21848, description: 最多 16 KiB 的规范参考证据 JSON}
      responses:
        '204': {description: 首次接纳已提交或完全相同的历史报告已确认}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 参考执行未显式启用}
        '409': {description: 授权或预留失效、证据不匹配或与历史报告冲突}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/assignment:
    post:
      operationId: describeReferenceMaterials
      description: 仅专用参考 mTLS 身份；返回与有效预留绑定的规范计划字节和保守剩余毫秒数。无续期或执行授权。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceMaterialInput'}
      responses:
        '200':
          description: 原冻结计划与有效预留；Worker 从请求开始计时以扣除完整往返耗时
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plan_encoding, remaining_ms]
                properties:
                  plan_encoding: {type: string, contentEncoding: base64, maxLength: 87384}
                  remaining_ms: {type: integer, minimum: 1, maximum: 30000}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 材料读取未显式启用}
        '409': {description: 预留、原授权、申请、草稿或计划已失效}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/material:
    post:
      operationId: downloadReferenceMaterial
      description: >-
        只读冻结计划中选定的一个对象；对象 I/O 前后复核原授权、节点与预留。
        连接写出受原预留截止时间约束。传输失败只截断正文，不追加错误 JSON。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ReferenceMaterialInput'}
                - {required: [object]}
      responses:
        '200':
          description: 已验证的原始私有字节；客户端仍须复核实际长度及 SHA-256
          headers:
            Content-Length: {required: true, schema: {type: integer, minimum: 0, maximum: 50331648}}
            X-Content-SHA256: {required: true, schema: {$ref: '#/components/schemas/Digest'}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 材料读取未显式启用}
        '409': {description: 预留失效或对象不属于当前冻结计划}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/differential/assignment:
    post:
      operationId: describeDifferentialReferenceMaterials
      description: 仅显式启用参考执行时的专用 mTLS 节点；通过原正式预留读取独立对拍计划，不续期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/DifferentialMaterialInput'}
                - not: {anyOf: [{required: [object]}, {required: [differential_sha256]}]}
      responses:
        '200':
          description: 绑定原正式计划的独立对拍计划；剩余时间从发出请求时计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plan_encoding, differential_sha256, remaining_ms]
                properties:
                  plan_encoding: {type: string, contentEncoding: base64, maxLength: 2732}
                  differential_sha256: {$ref: '#/components/schemas/Digest'}
                  remaining_ms: {type: integer, minimum: 1, maximum: 30000}
        '204': {description: 原预留仍有效，且历史正式计划没有独立对拍计划}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 参考执行或材料未启用}
        '409': {description: 原预留失效或已有对拍计划不可用}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/reference/differential/material:
    post:
      operationId: downloadDifferentialReferenceMaterial
      description: 仅允许对拍计划中的一份解法；读取前后复核原预留及两份计划，正式点和答案不可从此路由读取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/DifferentialMaterialInput'}
                - {required: [object, differential_sha256]}
      responses:
        '200':
          description: 已验证的解法字节；Worker 仍须复核长度及摘要
          headers:
            Content-Length: {required: true, schema: {type: integer, minimum: 1, maximum: 65536}}
            X-Content-SHA256: {required: true, schema: {$ref: '#/components/schemas/Digest'}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 参考执行或材料未启用}
        '409': {description: 原预留失效或对拍计划、摘要、对象不匹配}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/claim:
    post:
      operationId: claimWorkerLease
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: 原子认领一个任务；不含源码、答案或运行环境承诺
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [lease_token, submission_id, judge_generation, recovery_generation, attempt_number, lease_until]
                properties:
                  lease_token: {$ref: '#/components/schemas/Digest'}
                  submission_id: {type: string}
                  judge_generation: {type: integer, format: int64}
                  recovery_generation: {type: integer, format: int64}
                  attempt_number: {type: integer}
                  lease_until: {type: string, format: date-time}
        '204':
          description: 无任务或节点容量已满；客户端有界退避
          headers:
            Retry-After:
              schema: {type: string, const: '1'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/renew:
    post:
      operationId: renewWorkerLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_token]
              properties:
                lease_token: {$ref: '#/components/schemas/Digest'}
      responses:
        '200':
          description: 有效租约延长至数据库当前时刻后 30 秒；过期租约不复活
          content:
            application/json:
              schema:
                type: object
                required: [lease_until]
                additionalProperties: false
                properties:
                  lease_until: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/report:
    post:
      operationId: reportWorkerResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_token, verdict, evidence_sha256]
              properties:
                lease_token: {$ref: '#/components/schemas/Digest'}
                verdict: {type: string, enum: [AC, WA, CE, RE, TLE, MLE, OLE, SE]}
                evidence_sha256: {$ref: '#/components/schemas/Digest'}
      responses:
        '204':
          description: 接受结果或确认原样重复；SE 有限重试，耗尽后 failed/verdict=null
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/assignment:
    post:
      operationId: getWorkerAssignment
      description: >-
        当前节点有效租约限定的源码与固定清单。每次重新授权；已完成/过期/旧尝试或旧代次拒绝。
        manifest 是规范 JSON 原始字节的 base64，解码后核验 manifest_sha256；source 的 UTF-8 字节
        核验 source_sha256。清单 execution_environment=unvalidated 不得解释为可执行环境。
        m0-sum-v3 将 execution_environment 固定为环境对象，包含本机镜像 ID、平台、工具版本、参数及预算；
        image_id 是核验过的 Docker image store 报告的不可变身份，不包含可直接拉取的仓库名。
        v2 历史清单保持不变；当前执行端仅接受 v3，仍须核验实际环境并拒绝未知配置。
        控制端只领取/提供配置版本的材料；切换版本时不能把旧租约转交给新版本控制端。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_token]
              properties:
                lease_token: {$ref: '#/components/schemas/Digest'}
      responses:
        '200':
          description: 源码最多 64 KiB；规范清单最多 16 KiB（编码前字节数）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [submission_id, material_version, manifest_sha256, manifest, language, source, source_sha256]
                properties:
                  submission_id: {type: string}
                  material_version: {type: string}
                  manifest_sha256: {$ref: '#/components/schemas/Digest'}
                  manifest: {type: string, contentEncoding: base64, contentMediaType: application/json}
                  language: {type: string, const: 'gnu++17'}
                  source: {type: string}
                  source_sha256: {$ref: '#/components/schemas/Digest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/worker/material:
    post:
      operationId: downloadWorkerMaterial
      description: >-
        只可选择当前租约固定清单中的 test_id 和 input/answer，不接受任意路径、哈希或提交 ID。
        服务端流式校验后返回私有快照，并在释放字节前再次授权和验证证书。
        客户端须完整接收并核验清单中的 SHA-256；中断/截断不得用于判题。
        返回后的网络传输不持续锁定授权记录，已经发出的字节不能撤回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_token, test_id, kind]
              properties:
                lease_token: {$ref: '#/components/schemas/Digest'}
                test_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                kind: {type: string, enum: [input, answer]}
      responses:
        '200':
          description: 完整校验的原始文件，单文件最多 1 MiB；每控制端最多 4 个活动快照
          headers:
            Content-Length: {schema: {type: integer, minimum: 0, maximum: 1048576}}
            X-Content-SHA256: {schema: {$ref: '#/components/schemas/Digest'}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: MATERIAL_NOT_FOUND；有效租约清单中不存在该测试点
          content:
            application/problem+json:
              schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/MediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    workerMTLS: {type: mutualTLS}
  schemas:
    ReferenceMaterialInput:
      type: object
      additionalProperties: false
      required: [request_id, source_id, plan_sha256, lease_token]
      properties:
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        source_id: {type: string, minLength: 1, maxLength: 128}
        plan_sha256: {$ref: '#/components/schemas/Digest'}
        lease_token: {$ref: '#/components/schemas/Digest'}
        object:
          description: material 路由必填；assignment 不使用此字段
          type: object
          additionalProperties: false
          required: [sha256, size]
          properties:
            sha256: {$ref: '#/components/schemas/Digest'}
            size: {type: integer, minimum: 0, maximum: 50331648}
    DifferentialMaterialInput:
      type: object
      additionalProperties: false
      required: [request_id, source_id, plan_sha256, lease_token]
      properties:
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        source_id: {const: 'library-checker:convolution_mod'}
        plan_sha256: {$ref: '#/components/schemas/Digest'}
        lease_token: {$ref: '#/components/schemas/Digest'}
        differential_sha256: {$ref: '#/components/schemas/Digest'}
        object:
          type: object
          additionalProperties: false
          required: [sha256, size]
          properties:
            sha256: {$ref: '#/components/schemas/Digest'}
            size: {type: integer, minimum: 1, maximum: 65536}
    Digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  responses:
    Invalid:
      description: INVALID_REQUEST；无效 JSON、字段、租约或结果；拒绝未知字段、null 和尾随 JSON
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    Unauthenticated:
      description: UNAUTHENTICATED；证书身份格式错误或连接建立后证书失效
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    Forbidden:
      description: NODE_UNAUTHORIZED（未注册、停用或版本失效）或 WORKER_ONLY（带 Origin）
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    Conflict:
      description: LEASE_INVALID（异节点、过期或被替代）或 RESULT_CONFLICT（不同结果重复回报）
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    TooLarge:
      description: BODY_TOO_LARGE；超过 1024 字节
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    MediaType:
      description: UNSUPPORTED_MEDIA_TYPE；需要 application/json
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}
    Unavailable:
      description: WORKER_UNAVAILABLE；材料未配置、缺失/损坏/超限或存储不可用也返回此码。写操作可能已提交，保留原租约与结果核验，不暴露内部原因
      content:
        application/problem+json:
          schema: {$ref: './openapi.yaml#/components/schemas/Problem'}

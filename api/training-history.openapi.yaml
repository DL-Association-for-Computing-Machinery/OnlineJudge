openapi: 3.1.0
info:
  title: OnlineJudge Personal Training Submissions
  version: 0.4.0
  description: >-
    普通会话 HTTPS 下的可选能力。列表和详情分别由 training_history 和 training_submission_detail 启用；
    local_training_intake 为旧单队列模式；published_training 可让同一本机 API 为多份显式固定的已发布材料启用提交和原键回执。
    沿用普通会话的固定 Host、直连 TLS 或单跳 mTLS 代理。响应不缓存、不设置 Cookie。
security:
  - ordinarySession: []
paths:
  /api/v1/training/submissions:
    get:
      operationId: listOwnTrainingSubmissions
      description: >-
        每次从实际会话取得主体，再在同一 PostgreSQL 事务中复核当前账号资格并读取该主体的 personal-training 范围。
        不接受请求体、主体/范围参数或编码路径别名。按接收时间和提交 ID 降序，每页最多 20 条。
        游标仅指定查找边界，不能授权或切换主体。每页独立读取，不提供跨页快照；刷新第一页查看新提交和状态。
      parameters:
        - name: X-OJ-Expected-Subject
          in: header
          required: true
          description: 客户端最后确认的会话主体；只用于拒绝账号变化，不作为身份来源。
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: cursor
          in: query
          description: 首页省略；继续时原样回传非空 next_cursor。拒绝空值、重复、未知字段及编码别名。
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{80}$' }
      responses:
        '200':
          description: 本人摘要，不含源码、幂等键、其他范围或全局计数。
          headers:
            Cache-Control: { $ref: './session.openapi.yaml#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: './session.openapi.yaml#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [submissions, next_cursor]
                properties:
                  submissions:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/SubmissionSummary' }
                  next_cursor:
                    type: string
                    pattern: '^(?:[A-Za-z0-9_-]{80})?$'
                    description: 空字符串表示该次读取未观察到下一页。
        '400': { description: INVALID_HISTORY_REQUEST, $ref: '#/components/responses/Failure' }
        '401': { description: SESSION_REQUIRED, $ref: '#/components/responses/Failure' }
        '403': { description: TRAINING_ACCOUNT_REQUIRED 或 ORIGIN_REJECTED, $ref: '#/components/responses/Failure' }
        '404': { description: NOT_FOUND，普通会话入口未启用此能力, $ref: '#/components/responses/Failure' }
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            Allow: { schema: { type: string, enum: [GET, 'GET, POST'] } }
            Cache-Control: { $ref: './session.openapi.yaml#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: './session.openapi.yaml#/components/headers/NoSniff' }
          content:
            application/problem+json:
              schema: { $ref: './session.openapi.yaml#/components/schemas/Problem' }
        '409': { description: TRAINING_SUBJECT_CHANGED，当前会话主体与请求头不符, $ref: '#/components/responses/Failure' }
        '503': { description: SESSION_UNAVAILABLE 或 TRAINING_HISTORY_UNAVAILABLE, $ref: '#/components/responses/Failure' }
    post:
      operationId: submitLocalPublishedTraining
      description: >-
        仅启用本机执行队列时接受同源普通会话。服务端验证账号和当前发布记录，
        自行绑定已准入的执行材料。请求键在本人训练范围内绑定题目、发布版本、
        执行材料、GNU++17 和原始源码。接收回执可能已包含终态；响应未知时查询原键。
      parameters:
        - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
        - $ref: '#/components/parameters/TrainingRequestKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [problem_id, publication_version, source]
              properties:
                problem_id: { type: string, pattern: '^[a-f0-9]{32}$' }
                publication_version: { type: string, pattern: '^[a-f0-9]{64}$' }
                language: { type: string, enum: ['gnu++17', c17, 'gnu++20', java21, python3], default: 'gnu++17' }
                source: { type: string, minLength: 1, maxLength: 65536, description: 最多 65536 个 UTF-8 字节且不含 NUL。 }
      responses:
        '200': { $ref: '#/components/responses/TrainingReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { description: 题目版本未启用提交或入口未启用, $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { description: 当前主体变化或原键已用于不同内容, $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '429': { description: 队列额度已满，稍后用原键重试, $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/training/receipt:
    get:
      operationId: recoverOwnTrainingReceipt
      description: >-
        读取当前账号的原键回执，无需再次解析题库。404 不排除原请求仍在提交；
        不自动生成新请求键。请求不含查询串或正文。
      parameters:
        - $ref: './problem-draft-management.openapi.yaml#/components/parameters/ExpectedSubject'
        - $ref: '#/components/parameters/TrainingRequestKey'
      responses:
        '200': { $ref: '#/components/responses/TrainingReceipt' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
        '405': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /api/v1/training/submissions/{id}:
    get:
      operationId: readOwnTrainingSubmission
      description: >-
        每次从实际会话取得主体，在同一 PostgreSQL 事务中复核当前账号资格并按 ID、主体和固定
        personal-training 范围读取源码及当前判定。自动刷新使用只返回当前摘要的 view=status。
        不接受请求体、其他查询字段或编码路径别名。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: view
          in: query
          description: 省略时显式读取详情；传入原文 view=status 时仅返回摘要，不读取或传输源码。
          schema: { type: string, const: status }
        - name: X-OJ-Expected-Subject
          in: header
          required: true
          description: 客户端最后确认的会话主体；不作为身份来源。
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      responses:
        '200':
          description: 本人提交的当前判定；仅省略 view 时含源码。两种响应均不含测试点或 Worker 内部证据。
          headers:
            Cache-Control: { $ref: './session.openapi.yaml#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: './session.openapi.yaml#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/SubmissionSummary' }
                  - { $ref: '#/components/schemas/SubmissionDetail' }
        '400': { description: INVALID_TRAINING_DETAIL_REQUEST, $ref: '#/components/responses/Failure' }
        '401': { description: SESSION_REQUIRED, $ref: '#/components/responses/Failure' }
        '403': { description: TRAINING_ACCOUNT_REQUIRED 或 ORIGIN_REJECTED, $ref: '#/components/responses/Failure' }
        '404': { description: NOT_FOUND，未启用、提交不存在或不在本人个人训练范围, $ref: '#/components/responses/Failure' }
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            Allow: { schema: { type: string, const: GET } }
            Cache-Control: { $ref: './session.openapi.yaml#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: './session.openapi.yaml#/components/headers/NoSniff' }
          content:
            application/problem+json:
              schema: { $ref: './session.openapi.yaml#/components/schemas/Problem' }
        '409': { description: TRAINING_SUBJECT_CHANGED，当前会话主体与请求头不符, $ref: '#/components/responses/Failure' }
        '503': { description: SESSION_UNAVAILABLE 或 TRAINING_DETAIL_UNAVAILABLE, $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    ordinarySession: { type: apiKey, in: cookie, name: __Host-oj_session }
  parameters:
    TrainingRequestKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
  responses:
    TrainingReceipt:
      description: 已接收提交的本人摘要。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SubmissionSummary' }
    Failure:
      description: 拒绝或暂不可用；不返回提交数据。
      headers:
        Cache-Control: { $ref: './session.openapi.yaml#/components/headers/NoStore' }
        X-Content-Type-Options: { $ref: './session.openapi.yaml#/components/headers/NoSniff' }
      content:
        application/problem+json:
          schema: { $ref: './session.openapi.yaml#/components/schemas/Problem' }
  schemas:
    SubmissionSummary:
      $ref: '#/components/schemas/SubmissionReceiptFields'
      unevaluatedProperties: false
    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/SubmissionReceiptFields'
        - type: object
          required: [source]
          properties:
            source:
              type: string
              minLength: 1
              maxLength: 65536
              description: 原始提交源码；服务端以 UTF-8 字节计，至多 65,536 字节。
      unevaluatedProperties: false
    SubmissionReceiptFields:
      type: object
      required: [id, material_version, language, created_at, state, verdict]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        material_version: { type: string, minLength: 1, maxLength: 128 }
        language: { type: string, enum: ['gnu++17', c17, 'gnu++20', java21, python3] }
        created_at: { type: string, format: date-time }
        state: { type: string, enum: [queued, running, finished, failed] }
        verdict:
          type: [string, 'null']
          enum: [AC, WA, CE, RE, TLE, MLE, OLE, SE, null]
          description: 仅 finished 有判定。

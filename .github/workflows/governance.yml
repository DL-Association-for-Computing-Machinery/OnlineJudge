name: Repository governance

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository policy
        run: python3 scripts/repo_policy.py repository
      - name: Check squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/repo_policy.py pr-title
      - name: Test governance behavior
        run: python3 -B -m unittest discover -s tests/governance -v
      - name: Classify complete change scope
        id: scope
        run: python3 scripts/ci_scope.py plan

  backend-tests:
    needs: governance
    if: needs.governance.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check, test and build in Docker
        run: docker compose run --build --rm toolchain backend

  integration-tests:
    needs: governance
    if: needs.governance.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check generated SQL and real PostgreSQL integration
        run: |
          docker compose run --build --rm toolchain sqlc
          docker compose run --rm toolchain db

  frontend-tests:
    needs: governance
    if: needs.governance.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint, typecheck, test and build in Docker
        run: docker compose run --build --rm frontend-check

  containers:
    needs: governance
    if: needs.governance.outputs.backend == 'true' || needs.governance.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify the Compose application
        run: python3 scripts/test-compose.py

  required:
    # Stable required contexts; an upstream failure must never become a green skip.
    name: ${{ matrix.suite }}
    needs: [governance, backend-tests, frontend-tests, integration-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, frontend, integration]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify required suite outcome
        env:
          CI_SUITE: ${{ matrix.suite }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py gate
